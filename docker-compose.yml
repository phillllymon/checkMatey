version: "3.8"

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: checkmatey
      POSTGRES_PASSWORD: checkmatey
      POSTGRES_DB: checkMatey_production
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://checkmatey:checkmatey@db:5432/checkMatey_production
      REDIS_URL: redis://redis:6379/1
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      APP_HOST: localhost:3000

volumes:
  db_data:
